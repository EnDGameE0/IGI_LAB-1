{% extends 'base.html' %}
{% block title %}Удалить отзыв{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
<div class="card border-0 shadow-sm p-4 text-center">
    <i class="bi bi-exclamation-triangle-fill fs-1 text-danger mb-3"></i>
    <h5 class="fw-bold mb-3">Удалить отзыв?</h5>
    <p class="text-muted mb-4">Отзыв от <strong>{{ review.name }}</strong> будет удалён безвозвратно.</p>
    <form method="post" class="d-flex gap-2 justify-content-center">{% csrf_token %}
        <a href="{% url 'rooms:reviews' %}" class="btn btn-outline-navy px-4">Отмена</a>
        <button type="submit" class="btn btn-danger px-5">Удалить</button>
    </form>
</div>
</div></div>
{% endblock %}
