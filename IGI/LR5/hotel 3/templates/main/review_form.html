{% extends 'base.html' %}
{% block title %}Редактировать отзыв{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
<div class="form-panel">
    <div class="form-panel-header d-flex align-items-center gap-3">
        <i class="bi bi-pencil-square fs-4"></i>
        <div><h5 class="mb-0">Редактировать отзыв</h5></div>
    </div>
    <div class="form-panel-body">
        <form method="post">{% csrf_token %}
        {% for field in form %}
        <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}
        {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>
        {% endfor %}
        <div class="d-flex gap-2 justify-content-end">
            <a href="{% url 'rooms:reviews' %}" class="btn btn-outline-navy px-4">Отмена</a>
            <button type="submit" class="btn btn-navy px-5"><i class="bi bi-check2"></i> Сохранить</button>
        </div>
        </form>
    </div>
</div>
</div></div>
{% endblock %}
