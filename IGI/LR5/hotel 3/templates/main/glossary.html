{% extends 'base.html' %}
{% block title %}Словарь терминов{% endblock %}
{% block content %}
<div class="section-divider"><h5><i class="bi bi-book me-2" style="color:var(--gold)"></i>Словарь гостиничных терминов</h5></div>
<div class="accordion" id="glAcc">
{% for t in terms %}
<div class="accordion-item border mb-2 rounded-3 overflow-hidden">
    <h2 class="accordion-header">
        <button class="accordion-button collapsed fw-semibold" type="button" data-bs-toggle="collapse" data-bs-target="#t{{ t.pk }}">
            {{ t.term }}
        </button>
    </h2>
    <div id="t{{ t.pk }}" class="accordion-collapse collapse">
        <div class="accordion-body text-muted">{{ t.definition }}</div>
    </div>
</div>
{% endfor %}
</div>
{% endblock %}
