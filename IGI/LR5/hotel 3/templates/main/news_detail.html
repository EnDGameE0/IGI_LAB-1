{% extends 'base.html' %}
{% block title %}{{ article.title }}{% endblock %}
{% block content %}
<a href="{% url 'rooms:news' %}" class="btn btn-outline-navy btn-sm mb-3">← Назад</a>
<div class="row justify-content-center"><div class="col-md-8">
<h2 class="fw-bold">{{ article.title }}</h2>
<p class="text-muted small">{{ article.created_at|date:"d/m/Y H:i" }}</p>
{% if article.image %}<img src="{{ article.image.url }}" class="img-fluid rounded-3 mb-3">{% endif %}
<div>{{ article.content|linebreaks }}</div>
</div></div>
{% endblock %}
