version: '3.9'
services:
  web:
    build: .
    image: hotel-olimp:latest
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - log_data:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=hotel.settings
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://hotel_user:hotel_pass@db:5432/hotel_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data --skip-if-exists &&
             python manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_user -d hotel_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pg_data:
  media_data:
  log_data:
